name: Build and Deploy to VPS
on:
  push:
    tags: ['v*']

env:
  GO_VERSION: '1.22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: |
          server/go.sum
          client/go.sum

    - name: Get version from git tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build client
      working-directory: client
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
          -o yartime-client-linux-amd64 \
          ./cmd/client

    - name: Compute checksum and create version.json
      working-directory: client
      id: checksum
      run: |
        CHECKSUM=$(sha256sum yartime-client-linux-amd64 | awk '{print $1}')
        echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
        printf '{"version":"%s","checksum":"%s"}\n' \
          "${{ steps.version.outputs.version }}" \
          "${CHECKSUM}" > version.json

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: server/
        push: true
        tags: koldun1/yartime-server:latest

    - name: Deploy server to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          docker pull koldun1/yartime-server:latest
          cd /root/yartime-server
          docker-compose up -d

    - name: Upload client binary to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        source: "client/yartime-client-linux-amd64,client/version.json"
        target: "/root/yartime-server/binaries"
        strip_components: 0
