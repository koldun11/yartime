name: Build and Deploy to VPS
on:
  push:
    branches: [ main ]

env:
  GO_VERSION: '1.22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Get version from git
      id: version
      run: echo "version=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT

    - name: Build client
      working-directory: client
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
          -o yartime-client-linux-amd64 \
          ./cmd/client

    - name: Compute checksum
      working-directory: client
      run: |
        CHECKSUM=$(sha256sum yartime-client-linux-amd64 | awk '{print $1}')
        echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
        cat > version.json <<EOF
        {
          "version": "${{ steps.version.outputs.version }}",
          "checksum": "${CHECKSUM}"
        }
        EOF
      id: checksum

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: server/
        push: true
        tags: koldun1/yartime-server:latest

    - name: Deploy server to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          docker pull koldun1/yartime-server:latest
          cd /root/yartime-server
          docker-compose up -d

    - name: Upload client binary to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        source: "client/yartime-client-linux-amd64,client/version.json"
        target: "/root/yartime-server/binaries"
        strip_components: 0
